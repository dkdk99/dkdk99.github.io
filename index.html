<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>(무려) 3주 만의 F4 모임</title>
<meta property="og:title" content="(무려) 3주 만의 F4 모임">
<meta property="og:description" content="뭘 먹어야 잘 먹었다고 소문이 날까? 같이 투표해요">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
:root{
  --blush:#fdeef1; --ink:#4a0f28; --wine:#7d1d3f; --rose:#f2a7b8; --cream:#fff8f0;
  --u:min(1vw,4.3px);
  box-sizing:border-box;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:#f4d9df; color:var(--ink);
  font-family:"Gowun Batang","Batang","AppleMyungjo",serif}
.screen{
  position:relative; width:100%; max-width:430px; margin:0 auto; overflow:hidden;
  background:var(--blush); min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
}
.pg{flex:1; position:relative; display:flex; flex-direction:column; justify-content:flex-end;
  min-height:100vh; min-height:100dvh; animation:fade .35s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.photo{position:absolute; top:0; left:0; right:0; aspect-ratio:377/503;
  background:var(--img) center top/cover no-repeat}
.photo::after{content:""; position:absolute; inset:0;
  background:linear-gradient(0deg,#fdeef1 0%,rgba(253,238,241,.95) 16%,rgba(253,238,241,.72) 32%,rgba(253,238,241,0) 62%)}
main{position:relative; z-index:1; padding:calc(var(--u)*6);
  padding-bottom:calc(var(--u)*9 + env(safe-area-inset-bottom,0px))}
h1{margin:0; font-weight:700; line-height:1.32; letter-spacing:-.02em}
.l1{display:block; font-size:calc(var(--u)*6)}
.l1 b{display:inline-block; font-weight:700; background:var(--wine); color:var(--cream);
  padding:.05em .4em .1em; margin-right:.3em; transform:rotate(-2deg); letter-spacing:0}
.l2{display:block; font-size:calc(var(--u)*9.2); margin-top:.3em; color:var(--ink)}
.l1,.l2,.go{opacity:0; transform:translateY(14px); animation:in .6s ease forwards}
.l2{animation-delay:.35s}
@keyframes in{to{opacity:1; transform:none}}

/* 버튼: 와인색 바탕에 아가일 무늬와 이중 테두리 */
.go{
  position:relative; display:inline-flex; align-items:center; margin-top:calc(var(--u)*5.5);
  font:inherit; font-weight:700; font-size:calc(var(--u)*6.6); line-height:1.2; letter-spacing:-.01em;
  color:var(--cream); border:0; border-radius:0; cursor:pointer; padding:.55em .9em .6em;
  background-color:var(--wine);
  background-image:
    linear-gradient(45deg,transparent 47%,rgba(255,248,240,.22) 48% 52%,transparent 53%),
    linear-gradient(-45deg,transparent 47%,rgba(255,248,240,.22) 48% 52%,transparent 53%);
  background-size:16px 16px;
  box-shadow:inset 0 0 0 3px var(--wine), inset 0 0 0 5px var(--cream), calc(var(--u)*1.2) calc(var(--u)*1.2) 0 var(--rose);
  animation:in .6s ease .8s forwards, sway 2.4s ease-in-out 1.6s infinite;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.go:active{box-shadow:inset 0 0 0 3px var(--wine), inset 0 0 0 5px var(--cream); animation:none; opacity:1; transform:translate(2px,2px)}
.go:focus-visible{outline:3px solid var(--ink); outline-offset:4px}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) translateY(-2px)}}
.ch{display:inline-block; animation:wave 1.2s ease-in-out infinite; animation-delay:calc(var(--i)*.07s)}
.sp{display:inline-block; width:.3em}
@keyframes wave{0%,55%,100%{transform:translateY(0)}28%{transform:translateY(-.2em)}}
.note{display:inline-block; margin-left:.15em; color:var(--rose); animation:spin 1.4s ease-in-out infinite}
@keyframes spin{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-.28em) rotate(14deg)}}

/* 상단 문구 */
.top{position:absolute; z-index:2; top:0; left:0; right:0; margin:0; text-align:center;
  padding:calc(var(--u)*4.5 + env(safe-area-inset-top,0px)) calc(var(--u)*6) 0;
  font-weight:700; font-size:calc(var(--u)*5.6); line-height:1.3; letter-spacing:.02em; color:var(--wine);
  text-shadow:0 0 6px rgba(253,238,241,.95), 0 0 2px rgba(253,238,241,.95); animation:fade .8s ease both}

/* 이름표 */
.tag{
  position:absolute; z-index:2; left:var(--x); top:36%;
  transform:translateX(-50%) rotate(var(--r,0deg));
  font-weight:700; font-size:calc(var(--u)*4.8); line-height:1.2; white-space:nowrap;
  color:var(--cream); background:var(--wine); padding:.35em .8em .4em;
  box-shadow:inset 0 0 0 1.5px var(--wine), inset 0 0 0 3px var(--cream), calc(var(--u)*.8) calc(var(--u)*.8) 0 var(--rose);
  animation:tagIn .5s cubic-bezier(.3,1.5,.5,1) var(--d,0s) both;
}
.tag::after{content:""; position:absolute; left:50%; bottom:100%; margin-left:-6px;
  border:6px solid transparent; border-bottom-color:var(--wine)}
@keyframes tagIn{
  from{opacity:0; transform:translateX(-50%) translateY(10px) rotate(var(--r,0deg)) scale(.7)}
  to{opacity:1; transform:translateX(-50%) rotate(var(--r,0deg))}
}

/* 2페이지: 메뉴 고르기 */
.p2{justify-content:flex-start; align-items:stretch; text-align:center;
  padding:calc(var(--u)*6) calc(var(--u)*6) 0; gap:calc(var(--u)*4);
  background:
    linear-gradient(45deg,transparent 47%,rgba(125,29,63,.07) 48% 52%,transparent 53%),
    linear-gradient(-45deg,transparent 47%,rgba(125,29,63,.07) 48% 52%,transparent 53%), var(--blush);
  background-size:28px 28px,28px 28px,auto}
.link{align-self:flex-start; font:inherit; font-size:calc(var(--u)*4.4); color:var(--wine); background:none; border:0;
  padding:.3em 0; text-decoration:underline; text-underline-offset:.2em; cursor:pointer}
.p2 h2{margin:0; font-size:calc(var(--u)*8.6); color:var(--ink); line-height:1.25}
.sub{margin:calc(var(--u)*-1.5) 0 0; font-size:calc(var(--u)*4.6); color:var(--wine)}
.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:calc(var(--u)*2.6)}
.m{position:relative; font:inherit; font-weight:700; font-size:calc(var(--u)*4.6); color:var(--ink); cursor:pointer;
  background:var(--cream); border:2px solid var(--wine); border-radius:0;
  padding:calc(var(--u)*3) 0 calc(var(--u)*2.8); display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*1);
  touch-action:manipulation; -webkit-tap-highlight-color:transparent}
.m .e{font-size:calc(var(--u)*9.5); line-height:1}
.m[aria-pressed="true"]{background:var(--wine); color:var(--cream); box-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 var(--rose); transform:translate(-1px,-1px)}
.m[aria-pressed="true"]::after{content:"¹3"; position:absolute; top:2px; right:calc(var(--u)*2); font-size:calc(var(--u)*4.2); color:var(--rose)}
.m:focus-visible,.link:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.bar{position:sticky; bottom:0; margin-top:auto; display:flex; gap:calc(var(--u)*3);
  padding:calc(var(--u)*4) 0 calc(var(--u)*5 + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg,#fdeef1 72%,rgba(253,238,241,0))}
.btn{font:inherit; font-weight:700; font-size:calc(var(--u)*5.2); cursor:pointer; border:2px solid var(--wine);
  background:var(--wine); color:var(--cream); border-radius:0; padding:.55em 1em; flex:1; touch-action:manipulation}
.btn.ghost{background:var(--cream); color:var(--wine); flex:0 0 36%}
.btn:disabled{opacity:.4; cursor:default}
.btn:active:not(:disabled){transform:translate(2px,2px)}
.btn:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.m{word-break:keep-all; line-height:1.25; min-height:calc(var(--u)*27); justify-content:center}
.m .loc{font-size:calc(var(--u)*3.3); font-weight:400; line-height:1.25; opacity:.8; padding:0 calc(var(--u)*1.5)}
.res .big small{display:block; margin-top:.9em; font-size:calc(var(--u)*4); font-weight:400; opacity:.85}
.m .hrs{font-size:calc(var(--u)*3.3); font-weight:400; line-height:1.25; opacity:.8; padding:0 calc(var(--u)*1.5)}
#rh{margin-top:.3em!important}
.m.add{background:transparent; border-style:dashed; color:var(--wine)}
.m.add .e{font-size:calc(var(--u)*9.5); font-weight:400}
.addrow{display:flex; gap:calc(var(--u)*2.6)}
.addrow input{flex:1; min-width:0; font:inherit; font-size:max(16px,calc(var(--u)*5)); color:var(--ink);
  background:var(--cream); border:2px solid var(--wine); border-radius:0; padding:.5em .7em}
.addrow input:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.addrow .btn{flex:0 0 auto; padding:.5em 1.1em}
.msg{margin:calc(var(--u)*-1) 0 0; min-height:1.2em; font-size:calc(var(--u)*4); color:var(--wine)}
.res{display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*5); padding-top:calc(var(--u)*10)}
.res .big{width:100%; background:var(--wine); color:var(--cream); padding:calc(var(--u)*8) calc(var(--u)*4);
  box-shadow:calc(var(--u)*1.4) calc(var(--u)*1.4) 0 var(--rose); font-size:calc(var(--u)*6)}
.res .big .e{display:block; font-size:calc(var(--u)*22); line-height:1.1}
.res .big strong{display:block; font-size:calc(var(--u)*10.5); margin-top:.2em; word-break:keep-all; line-height:1.25}
.res .btn{flex:none; width:100%}

/* 투표 */
.topbar{display:flex; justify-content:space-between; align-items:center}
.who{display:flex; gap:calc(var(--u)*2)}
.chip{flex:1; font:inherit; font-weight:700; font-size:calc(var(--u)*5); color:var(--wine); background:var(--cream);
  border:2px solid var(--wine); border-radius:0; padding:.5em 0; cursor:pointer; touch-action:manipulation}
.chip[aria-pressed="true"]{background:var(--wine); color:var(--cream); box-shadow:calc(var(--u)*.8) calc(var(--u)*.8) 0 var(--rose)}
.chip:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.resv{display:flex; flex-direction:column; gap:calc(var(--u)*4); padding-bottom:calc(var(--u)*10 + env(safe-area-inset-bottom,0px))}
.resv h2{margin:0}
.list{display:flex; flex-direction:column; gap:calc(var(--u)*3); text-align:left}
.vr{background:var(--cream); border:2px solid var(--wine); padding:calc(var(--u)*3.5) calc(var(--u)*4);
  display:grid; grid-template-columns:auto 1fr auto; column-gap:calc(var(--u)*3); align-items:center}
.vr .crown{grid-column:1 / 4; justify-self:start; font-size:calc(var(--u)*3.8); font-weight:700;
  background:var(--rose); color:var(--ink); padding:.1em .7em .15em; margin-bottom:calc(var(--u)*2.5)}
.vr .e{font-size:calc(var(--u)*8); grid-row:span 2}
.vr .nm{font-weight:700; font-size:calc(var(--u)*5.4); word-break:keep-all; line-height:1.25}
.vr .ct{font-weight:700; font-size:calc(var(--u)*6); color:var(--wine)}
.vr .vs{grid-column:2 / 4; display:flex; flex-wrap:wrap; gap:calc(var(--u)*1.5); margin-top:calc(var(--u)*1.5)}
.vr .vs span{font-size:calc(var(--u)*3.8); background:var(--wine); color:var(--cream); padding:.1em .6em .15em}
.vr.top{background:var(--wine); color:var(--cream); box-shadow:calc(var(--u)*1.4) calc(var(--u)*1.4) 0 var(--rose);
  transform:scale(1.02); animation:topin .5s ease}
.vr.top .ct{color:var(--cream)}
.vr.top .vs span{background:var(--rose); color:var(--ink)}
@keyframes topin{from{transform:scale(.94); opacity:.4}to{transform:scale(1.02); opacity:1}}
.winner{display:flex; flex-direction:column; gap:calc(var(--u)*1.5); align-items:center; text-align:center;
  background:var(--wine); color:var(--cream); padding:calc(var(--u)*6) calc(var(--u)*4);
  box-shadow:calc(var(--u)*1.4) calc(var(--u)*1.4) 0 var(--rose)}
.winner small{font-size:calc(var(--u)*4.6); color:var(--rose); font-weight:700}
.winner strong{font-size:calc(var(--u)*10); line-height:1.25; word-break:keep-all}
.h3{margin:calc(var(--u)*3) 0 0; font-size:calc(var(--u)*5.6); text-align:left; color:var(--ink)}
.pv{display:flex; align-items:baseline; gap:calc(var(--u)*3); background:var(--cream); border:2px solid var(--wine);
  padding:calc(var(--u)*3) calc(var(--u)*4); font-size:calc(var(--u)*4.8)}
.pv b{flex:0 0 auto; background:var(--wine); color:var(--cream); padding:.1em .7em .15em}
.pv.none{opacity:.6}
.resv textarea{font:inherit; font-size:max(16px,calc(var(--u)*5)); color:var(--ink); background:var(--cream); border:2px solid var(--wine); border-radius:0; padding:.6em .8em; width:100%; resize:vertical}
.resv textarea:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.resv .addrow .btn{width:auto; flex:0 0 auto}
.resv #sharetext{font:inherit; font-size:max(16px,calc(var(--u)*4.4)); color:var(--ink); background:var(--cream); border:2px solid var(--wine); border-radius:0; padding:.6em .8em; width:100%}
.pending{margin:0; font-size:calc(var(--u)*4.2); color:var(--wine)}
.resv .btn{flex:none; width:100%}
@media (prefers-reduced-motion: reduce){.vr.top{animation:none}}
@media (prefers-reduced-motion: reduce){
  .l1,.l2,.go{opacity:1; transform:none; animation:none}
  .ch,.note,.pg,.tag,.top{animation:none}
}
</style>
</head>

<script>
const p1=document.getElementById('p1'),p2=document.getElementById('p2');
const grid=document.getElementById('grid'),ok=document.getElementById('ok'),choose=document.getElementById('choose'),resv=document.getElementById('resv');
const addrow=document.getElementById('addrow'),newname=document.getElementById('newname'),msg=document.getElementById('msg');
const base=[['삼육 식당','🥓','중구 서성로13길 38'],['로망 라멘','🍜','남구 대명동 1891-5','브레이크 15:00~17:00'],['17길','🍛','수성구 두산동 170-21','브레이크 15:00~17:30'],['송원 식당','🐟','남구 대명동 627-6'],['페라리 막창','🏎️','수성구 중동 178-7','17:00 오픈'],['원영픽 닭갈비','🍗'],['후후카레','🍛','수성구 범어동 227-1','브레이크 15:00~17:00']];
let custom=[]; try{custom=JSON.parse(localStorage.getItem('f4-custom')||'[]')}catch(e){}
let myId=''; try{myId=localStorage.getItem('f4-vid')||''}catch(e){}
if(!/^v[a-z0-9]{6,24}$/.test(myId)){
  myId='v'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  try{localStorage.setItem('f4-vid',myId)}catch(e){}
}
let localVote=null; try{localVote=JSON.parse(localStorage.getItem('f4-myvote')||'null')}catch(e){}
let shared=[], sharedVotes={}, places=null, votesCol=null, menus=[], picks=[], busy=false, view='choose', saveNote='';

function cleanPicks(a){ return Array.isArray(a)?[...new Set(a.filter(q=>typeof q==='string'))].slice(0,2):[] }
function effVotes(){
  const out=Object.assign({},sharedVotes);
  if(!out[myId] && localVote && Array.isArray(localVote.picks)) out[myId]=localVote;
  return out;
}
function build(){
  const seen=new Set(base.map(m=>m[0]));
  menus=base.slice();
  shared.concat(custom).forEach(n=>{ if(!seen.has(n)){seen.add(n); menus.push([n,'🍽️'])} });
  grid.innerHTML='';
  menus.forEach(m=>{
    const b=document.createElement('button'); b.type='button'; b.className='m';
    b.innerHTML='<span class="loc"></span><span class="e"></span><span class="n"></span><span class="hrs"></span>';
    b.children[0].textContent=m[2]||''; b.children[0].hidden=!m[2]; b.children[1].textContent=m[1];
    b.children[2].textContent=m[0]; b.children[3].textContent=m[3]||''; b.children[3].hidden=!m[3];
    b.onclick=()=>toggle(m[0]); grid.appendChild(b);
  });
  const a=document.createElement('button'); a.type='button'; a.className='m add';
  a.innerHTML='<span class="e">+</span><span>선택지 추가</span>';
  a.onclick=()=>{addrow.hidden=!addrow.hidden; if(!addrow.hidden){newname.focus()}};
  grid.appendChild(a);
  refresh();
}
function refresh(){
  [...grid.querySelectorAll('.m:not(.add)')].forEach(b=>b.setAttribute('aria-pressed',picks.includes(b.querySelector('.n').textContent)?'true':'false'));
  ok.disabled=!picks.length;
}
function toggle(name){
  const i=picks.indexOf(name);
  if(i>=0){picks.splice(i,1); msg.textContent=''}
  else if(picks.length>=2){msg.textContent='최대 2개까지 고를 수 있어요'; return}
  else {picks.push(name); msg.textContent=''}
  refresh();
}
function saveLocal(v){
  if(!custom.includes(v)) custom.push(v);
  try{localStorage.setItem('f4-custom',JSON.stringify(custom))}catch(e){}
}
async function addItem(){
  const v=newname.value.trim().replace(/\s+/g,' ');
  if(!v){msg.textContent='식당 이름을 입력해 주세요'; return}
  if(menus.some(m=>m[0]===v)){msg.textContent='이미 있는 선택지예요'; return}
  let okShared=false;
  if(places){ try{ await places.add({name:v,t:Date.now()}); okShared=true }catch(e){} }
  if(okShared){ msg.textContent='"'+v+'" 추가했어요. 모두에게 보여요'; shared.push(v); }
  else { saveLocal(v); msg.textContent='"'+v+'" 추가했어요. 이 기기에서만 보여요'; }
  newname.value=''; build();
  if(picks.length<2) picks.push(v); refresh();
}
document.getElementById('addok').onclick=addItem;
newname.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault(); addItem()}};

document.getElementById('rand').onclick=()=>{
  if(busy||menus.length<2)return; busy=true; let n=0;
  const pair=()=>{const a=Math.floor(Math.random()*menus.length); let b=Math.floor(Math.random()*menus.length); while(b===a) b=Math.floor(Math.random()*menus.length); return [menus[a][0],menus[b][0]]};
  const t=setInterval(()=>{picks=pair(); refresh(); if(++n>13){clearInterval(t);busy=false}},80);
};

ok.onclick=async()=>{
  if(!picks.length) return;
  ok.disabled=true;
  const body={picks:picks.slice(0,2),t:Date.now()};
  let saved=false;
  if(votesCol){ try{ await votesCol.doc(myId).set(body); saved=true }catch(e){} }
  if(saved){ sharedVotes[myId]=body; localVote=null; try{localStorage.removeItem('f4-myvote')}catch(e){} saveNote=''; }
  else { localVote=body; try{localStorage.setItem('f4-myvote',JSON.stringify(body))}catch(e){} saveNote='공유 저장이 안 돼서 내 투표는 이 기기에서만 보여요'; }
  ok.disabled=false; show('res');
};

function renderRes(){
  const v=effVotes(), tally=new Map(); let voters=0;
  Object.values(v).forEach(x=>{
    const ps=cleanPicks(x&&x.picks); if(!ps.length) return; voters++;
    ps.forEach(p=>tally.set(p,(tally.get(p)||0)+1));
  });
  const idx=n=>{const i=menus.findIndex(m=>m[0]===n); return i<0?999:i};
  const entries=[...tally.entries()].sort((a,b)=>b[1]-a[1]||idx(a[0])-idx(b[0]));
  document.getElementById('rsub').textContent=entries.length?(voters+'명 투표'):'아직 투표가 없어요';
  document.getElementById('rmsg').textContent=saveNote;
  const list=document.getElementById('rlist'); list.innerHTML='';
  const max=entries.length?entries[0][1]:0, tops=entries.filter(e=>e[1]===max).length;
  entries.forEach(([name,count])=>{
    const top=count===max;
    const d=document.createElement('div'); d.className='vr'+(top?' top':'');
    if(top){const c=document.createElement('span'); c.className='crown'; c.textContent=tops>1?'👑 공동 1등':'👑 가장 많이 뽑혔어요'; d.appendChild(c)}
    const e=document.createElement('span'); e.className='e'; e.textContent=(menus.find(m=>m[0]===name)||[0,'🍽️'])[1];
    const nm=document.createElement('span'); nm.className='nm'; nm.textContent=name;
    const ct=document.createElement('span'); ct.className='ct'; ct.textContent=count+'표';
    d.append(e,nm,ct); list.appendChild(d);
  });
  const win=document.getElementById('winner');
  if(entries.length){
    const names=entries.filter(x=>x[1]===max).map(x=>x[0]);
    win.hidden=false; win.innerHTML='';
    const l=document.createElement('small'); l.textContent=names.length>1?'🏆 공동 1위':'🏆 1위';
    const t=document.createElement('strong'); t.textContent=names.join(' / ');
    const c=document.createElement('small'); c.textContent=max+'표';
    win.append(l,t,c);
  } else win.hidden=true;
  const mine=effVotes()[myId], sh=document.getElementById('share');
  sh.hidden=!(mine && cleanPicks(mine.picks).length);
}
function show(v){
  view=v; choose.style.display=v==='choose'?'contents':'none'; resv.hidden=v!=='res';
  if(v==='res') renderRes(); window.scrollTo(0,0);
}
function loadMine(){ const m=effVotes()[myId]; if(m){ picks=cleanPicks(m.picks); refresh(); } }
document.getElementById('share').onclick=async()=>{
  const m=effVotes()[myId], ps=m?cleanPicks(m.picks):[]; if(!ps.length) return;
  const url=location.href.split('#')[0];
  const text='[F4 모임] 나는 '+ps.join(', ')+' 골랐어! 🍽️\n투표하러 가기';
  const note=document.getElementById('rmsg'), box=document.getElementById('sharetext');
  try{ if(navigator.share){ await navigator.share({title:'F4 모임 투표',text,url}); return } }catch(e){ if(e && e.name==='AbortError') return }
  const full=text+'\n'+url;
  try{ await navigator.clipboard.writeText(full); note.textContent='문구를 복사했어요. 카톡방에 붙여넣어 보내세요'; }
  catch(e){ box.hidden=false; box.value=full; box.focus(); box.select(); note.textContent='문구를 길게 눌러 복사한 뒤 카톡방에 붙여넣어 주세요'; }
};
document.getElementById('again').onclick=()=>{ loadMine(); show('choose') };
document.getElementById('seeres').onclick=()=>show('res');
document.getElementById('go').onclick=()=>{p1.hidden=true;p2.hidden=false;show('choose')};
document.getElementById('back').onclick=()=>{p2.hidden=true;p1.hidden=false;window.scrollTo(0,0)};
build(); loadMine();

// ===== Firebase Realtime Database(REST) 연결 =====
// Firebase 콘솔에서 Realtime Database를 만들고, 만들어진 데이터베이스 주소를 아래 따옴표 안에 붙여넣으세요.
// 예: const FB_URL='https://f4-xxxxx-default-rtdb.asia-southeast1.firebasedatabase.app';
const FB_URL='https://tada-3e98b-default-rtdb.asia-southeast1.firebasedatabase.app';
(function(){
  const base=(FB_URL||'').trim().replace(/\/+$/,'');
  if(!/^https:\/\/.+/.test(base)) return;   // 비어 있으면 각자 기기에만 저장돼요
  const j=r=>{ if(!r.ok) throw new Error(r.status); return r.json() };
  places={add:o=>fetch(base+'/f4/places.json',{method:'POST',body:JSON.stringify(o)}).then(j)};
  votesCol={doc:id=>({set:b=>fetch(base+'/f4/votes/'+id+'.json',{method:'PUT',body:JSON.stringify(b)}).then(j)})};
  let sig='';
  async function pull(){
    try{
      const d=(await fetch(base+'/f4.json',{cache:'no-store'}).then(j))||{};
      const t=JSON.stringify(d); if(t===sig) return; sig=t;
      shared=Object.values(d.places||{}).sort((a,b)=>((a&&a.t)||0)-((b&&b.t)||0)).map(x=>x&&x.name).filter(n=>typeof n==='string');
      sharedVotes={};
      Object.entries(d.votes||{}).forEach(([id,x])=>{ if(x && Array.isArray(x.picks)) sharedVotes[id]=x });
      build(); if(!picks.length) loadMine();
      if(view==='res') renderRes();
    }catch(e){}
  }
  pull(); setInterval(()=>{ if(!document.hidden) pull() },4000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pull() });
})();
</script>
